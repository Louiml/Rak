name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag/version (e.g. v8.1.0). Empty uses the latest v* tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        id: set-tag
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # workflow_dispatch without a version input: reuse the latest v* tag.
            TAG="$(git tag --sort=-v:refname | grep '^v' | head -n1)"
            [ -z "$TAG" ] && TAG="v0.8.3"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" --title "Rak $TAG" --notes-file .github/release_body.md --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri's bundler names the .deb, .AppImage and .msi after the IDE crate
      # version, and that version lives in three files. Bumping them by hand is
      # how v8.1.0 published rak-ide_8.0.0_amd64.deb inside the v8.1.0 release:
      # the workspace and the VS Code extension were bumped, the IDE was not, and
      # an MSI upgrade from 8.0.0 would not have been offered. Derive it from the
      # tag instead so the two cannot drift, and fail loudly if the substitution
      # misses a file. It is a script rather than inline shell so it can be run
      # against a throwaway tree instead of only being found wrong once a release
      # is already public.
      - name: Pin the IDE version to the release tag
        run: bash scripts/pin-ide-version.sh
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        # The xkbcommon/wayland/x11 packages are for the eframe-based installer
        # GUI built below; winit's build script fails without `xkbcommon`.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            patchelf

      # No `--features gui`. That feature routes `rakc run` through
      # `eval_in_cli_with_gui`, which runs the program on a worker thread and then makes
      # the main thread the tao event loop -- so `run` opened a window and blocked until
      # it was dismissed, instead of printing to stdout. Every other subcommand is
      # unaffected, so the release looked healthy while its most-used command did the
      # wrong thing. The README documents `rakc run file.rak` as a console command
      # (running a server, a client, an interpreter), which a window cannot do.
      #
      # The GUI front end remains buildable with `--features gui` for anyone who wants it;
      # it is not what a released `rakc` should be.
      - name: Build rakc
        run: cargo build --release --bin rakc
      - name: Build rak-setup
        run: cargo build --release --bin rak-setup

      - name: Verify the hardening verifier itself
        run: python dist/verify_hardening.py --self-test

      - name: Verify hardening landed in the binaries
        # A linker flag is a claim; this reads the produced ELF back and checks
        # what the linker actually emitted, so a typo in .cargo/config.toml
        # cannot ship a soft binary.
        run: |
          python dist/verify_hardening.py \
            target/release/rakc \
            target/release/rak-setup

      # Smoke-test the artifact rather than the source. The test workflow never builds
      # with `--features gui`, so the suite cannot see a packaging difference -- only the
      # built binary reveals it, and a blocking front end has to be turned into a failure
      # rather than left to hang the job.
      - name: Smoke-test the release binary
        shell: bash
        run: python scripts/smoke_release.py target/release/rakc 0.9.0

      - name: Copy binaries for IDE bundling
        run: |
          mkdir -p ide/src-tauri/resources
          cp target/release/rakc ide/src-tauri/resources/rakc
          chmod +x ide/src-tauri/resources/rakc

      - name: Install IDE dependencies
        run: cd ide && npm install

      - name: Build IDE (Tauri)
        run: cd ide && npx tauri build
        env:
          CI: true

      - name: Stage arch-suffixed assets + portable IDE + offline bundle
        run: |
          set -e
          mkdir -p staging
          cp target/release/rakc            staging/rakc-linux-x86_64
          cp target/release/rak-setup       staging/rak-setup-linux-x86_64
          chmod +x staging/*
          # Portable IDE archive: the raw Tauri app binary (cargo bin name is
          # `app`) + bundled resources, renamed to `rak-ide`.
          mkdir -p ide-portable
          cp target/release/app ide-portable/rak-ide || cp target/release/rak-ide ide-portable/rak-ide
          chmod +x ide-portable/rak-ide
          tar -czf staging/rak-ide-linux-x86_64.tar.gz -C ide-portable .
          # Offline bundle: rakc + ide/ (single tar.gz for `--offline`).
          mkdir -p bundle/ide
          tar -xzf staging/rak-ide-linux-x86_64.tar.gz -C bundle/ide
          tar -czf staging/rak-bundle-linux-x86_64.tar.gz -C bundle .

      - name: Upload rakc to release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/rakc-linux-x86_64
          tag_name: ${{ needs.create-release.outputs.tag }}
      - name: Upload rak-setup to release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/rak-setup-linux-x86_64
          tag_name: ${{ needs.create-release.outputs.tag }}

      - name: Upload portable IDE archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/rak-ide-linux-x86_64.tar.gz
          tag_name: ${{ needs.create-release.outputs.tag }}

      - name: Upload offline bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/rak-bundle-linux-x86_64.tar.gz
          tag_name: ${{ needs.create-release.outputs.tag }}

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/deb/*.deb
          tag_name: ${{ needs.create-release.outputs.tag }}

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/appimage/*.AppImage
          tag_name: ${{ needs.create-release.outputs.tag }}

  windows:
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The MSI and NSIS installer are named from the IDE crate version as
      # well, so this job needs the same pinning the Linux one has. Leaving it
      # out here would have produced a 8.0.0 installer alongside a 8.0.0 .deb and
      # been noticed only by whoever tried to upgrade.
      - name: Pin the IDE version to the release tag
        run: bash scripts/pin-ide-version.sh
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `--features gui`. That feature routes `rakc run` through
      # `eval_in_cli_with_gui`, which runs the program on a worker thread and then makes
      # the main thread the tao event loop -- so `run` opened a window and blocked until
      # it was dismissed, instead of printing to stdout. Every other subcommand is
      # unaffected, so the release looked healthy while its most-used command did the
      # wrong thing. The README documents `rakc run file.rak` as a console command
      # (running a server, a client, an interpreter), which a window cannot do.
      #
      # The GUI front end remains buildable with `--features gui` for anyone who wants it;
      # it is not what a released `rakc` should be.
      - name: Build rakc
        run: cargo build --release --bin rakc
      - name: Build rak-setup
        run: cargo build --release --bin rak-setup

      - name: Verify the hardening verifier itself
        run: python dist/verify_hardening.py --self-test

      - name: Verify hardening landed in the binaries
        # /guard:cf, /DYNAMICBASE, /HIGHENTROPYVA and /NXCOMPAT are linker
        # flags, so a typo silently produces an unhardened binary. Read the PE
        # back and assert the DllCharacteristics bits and the CFG load config.
        run: |
          python dist/verify_hardening.py `
            target\release\rakc.exe `
            target\release\rak-setup.exe

      # Smoke-test the artifact rather than the source. The test workflow never builds
      # with `--features gui`, so the suite cannot see a packaging difference -- only the
      # built binary reveals it, and a blocking front end has to be turned into a failure
      # rather than left to hang the job.
      - name: Smoke-test the release binary
        shell: bash
        run: python scripts/smoke_release.py target/release/rakc.exe 0.9.0

      - name: Copy binaries for IDE bundling
        run: |
          New-Item -ItemType Directory -Force -Path ide/src-tauri/resources
          Copy-Item target/release/rakc.exe ide/src-tauri/resources/rakc.exe

      - name: Install IDE dependencies
        run: cd ide && npm install

      - name: Build IDE (Tauri)
        run: cd ide && npx tauri build
        env:
          CI: true

      - name: Stage arch-suffixed assets + portable IDE + offline bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/release/rakc.exe        staging/rakc-windows-x86_64.exe
          Copy-Item target/release/rak-setup.exe   staging/rak-setup-windows-x86_64.exe
          # Portable IDE archive: the raw Tauri app exe (cargo bin name is
          # `app`) + bundled resources, renamed to `rak-ide.exe`.
          New-Item -ItemType Directory -Force -Path ide-portable | Out-Null
          if (Test-Path target/release/app.exe) {
            Copy-Item target/release/app.exe ide-portable/rak-ide.exe
          } elseif (Test-Path target/release/rak-ide.exe) {
            Copy-Item target/release/rak-ide.exe ide-portable/rak-ide.exe
          } else {
            throw "IDE binary not found (expected target/release/app.exe or rak-ide.exe)"
          }
          Compress-Archive -Path ide-portable\* -DestinationPath staging/rak-ide-windows-x86_64.zip -Force
          # Offline bundle (zip).
          New-Item -ItemType Directory -Force -Path bundle\ide | Out-Null
          Expand-Archive -Path staging/rak-ide-windows-x86_64.zip -DestinationPath bundle\ide -Force
          Compress-Archive -Path bundle\* -DestinationPath staging/rak-bundle-windows-x86_64.zip -Force

      - name: Upload rakc.exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/rakc-windows-x86_64.exe
          tag_name: ${{ needs.create-release.outputs.tag }}
      - name: Upload rak-setup.exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/rak-setup-windows-x86_64.exe
          tag_name: ${{ needs.create-release.outputs.tag }}

      - name: Upload portable IDE zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/rak-ide-windows-x86_64.zip
          tag_name: ${{ needs.create-release.outputs.tag }}

      - name: Upload offline bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: staging/rak-bundle-windows-x86_64.zip
          tag_name: ${{ needs.create-release.outputs.tag }}

      - name: Upload NSIS installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          tag_name: ${{ needs.create-release.outputs.tag }}

      - name: Upload MSI to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/msi/*.msi
          tag_name: ${{ needs.create-release.outputs.tag }}
