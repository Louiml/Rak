name: CI

# The release workflow builds and publishes, but through v8.0.0 it never ran a
# test. That is how nineteen builtins shipped that existed only in the VM:
# `rakc run` failed with `Unknown function` for every one of them, and the suite
# was green because it never ran at all.
#
# This workflow runs on every push and pull request so that class of regression
# is caught before a tag, not after one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel a superseded run on the same ref. Saves CI minutes on a branch that
  # is being pushed to repeatedly, and avoids two runs racing to report on the
  # same commit.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms, not just Linux. The UDP timeout bug this release
        # fixed existed because Windows and Linux report the same socket
        # condition as different `io::ErrorKind` variants, so a test that only
        # runs on Linux cannot see it.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV
          cargo -vV

      - name: Install Linux dependencies
        # The workspace includes the Tauri IDE crate, which links against GTK
        # and WebKitGTK. Without these the build script for `glib-sys` fails
        # with "Package glib-2.0 was not found in the pkg-config search path",
        # and because the test job runs `--workspace` that took down the whole
        # Linux run before a single test executed. The release workflow has
        # always installed these; this workflow did not.
        #
        # The xkbcommon/wayland/x11 packages are for the eframe-based installer
        # GUI. It builds the `x11` and `wayland` backends so the window works on a
        # plain X11 session as well as under Wayland, and winit fails its build
        # script without `xkbcommon` present at link time.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-${{ matrix.os }}-

      - name: Run the test suites
        # `--no-fail-fast` so every suite runs even after one fails: the parity
        # gate failing and the examples failing are different pieces of
        # information, and stopping at the first would hide the second.
        #
        # `--lib --tests` and not just `--tests`: doc-tests need rustdoc, which
        # is not present in a minimal toolchain profile, so including them turns
        # a missing component into a test failure. The docs are built and tested
        # by `cargo doc` in the release workflow instead.
        #
        # The suites are not run through `scripts/run-tests-safe.ps1`, which
        # needs PowerShell and is the right tool on a developer machine. On CI
        # the equivalent protection is cargo's own per-test timeout, and the
        # runner is disposable, so a runaway process costs minutes rather than
        # the machine.
        #
        # `--workspace --exclude app`: `app` is the Tauri IDE crate. It has no
        # tests, and it cannot be built here at all -- tauri.conf.json declares
        # `resources/rakc*` as bundled resources, and tauri-build fails the build
        # when such a glob matches nothing, which it does on a clean checkout
        # with no prebuilt compiler. Excluding it here costs no coverage (the
        # release workflow still compiles and bundles the IDE before every tag);
        # naming the crates explicitly keeps this from silently drifting back to
        # `--workspace` and re-breaking the run.
        run: >-
          cargo test --workspace --exclude app
          --lib --tests --no-fail-fast -- --test-threads=1

      - name: Summarise the test results
        # Re-runs nothing; reads what is already in the log. GitHub collapses
        # long output, and the one number that matters is how many suites passed.
        if: always()
        run: |
          echo "See the 'Run the test suites' step for per-suite results."
          echo "backend parity is expected to PASS: the two backends register"
          echo "the same builtins, and docs/V8-BACKEND-PARITY.md records what closed it."

      - name: Report the backend-parity registration sets
        # Prints both registration sets without failing. The gate test in the
        # suite above already requires them to be identical; this makes the
        # contents visible without digging out an ignored test, so the surface
        # stays readable at a glance.
        if: runner.os == 'Linux'
        run: |
          cargo test -p rakc --test backend_parity -- --ignored --nocapture parity_backlog_report || true

  browser:
    name: browser build (the playground's configuration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # The wasm target as well: the playground is a WebAssembly module, and
        # a target that is not installed fails at the build rather than at the
        # test.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc -vV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-browser-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-browser-

      - name: Test the build without the features a browser cannot have
        # The playground runs the interpreter compiled to WebAssembly, and that
        # build turns `http`, `async`, `rand` and `html` off: their
        # dependencies do not compile to wasm. The default test run never
        # exercises that configuration, so a feature gate that only breaks the
        # browser build would ship unnoticed -- and the browser build is the
        # one every visitor to the docs site runs.
        #
        # `--no-default-features` is passed to `rakc` alone: the standard
        # library's own features are selected by `rakc`'s, so this is the
        # browser's configuration and not a different one.
        run: >-
          cargo test -p rakc --no-default-features
          --lib --tests --no-fail-fast -- --test-threads=1

      - name: Build the playground
        # The wasm payload is committed to the repository, so a change to the
        # interpreter that breaks the browser build has to fail here rather
        # than in the page.
        run: >-
          cargo build -p rak-playground --profile playground
          --target wasm32-unknown-unknown

      - name: The playground module runs a program
        # The page loads `docs/rak.wasm` from the repository, so the file in
        # the tree has to be checked, not just the source it was built from.
        # The check is behavioural rather than a comparison of file sizes: a
        # byte-for-byte or size comparison would fail on every toolchain
        # bump, and a permanently red job is a job people stop reading.
        #
        # Both modules are checked: the one just built, which proves the
        # source still compiles to a module that works, and the one committed,
        # which proves the site serves a module that works.
        run: |
          node playground/check.mjs target/wasm32-unknown-unknown/playground/rak_playground.wasm
          node playground/check.mjs docs/rak.wasm

  lint:
    name: clippy and fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # `rustup component add` as its own step, not `--component a, b` on the
        # install line: the space after the comma makes rustup read the second
        # name as a separate argument, and the job fails at toolchain setup
        # before a single line of clippy runs.
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
          rustc -vV
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-lint-
      - name: Formatting
        # A hard failure.
        #
        # This was a warning, on the reasoning that the tree was not
        # rustfmt-clean and reformatting it would put a large diff through
        # code nobody had read. The tree *is* rustfmt-clean now, and a check
        # that cannot fail is not a check: the one job in this file that
        # prevents a class of review friction was reporting success on a tree
        # it had never actually formatted.
        run: cargo fmt --all --check
      - name: Clippy
        # `-D warnings` so a new lint is a failure rather than noise to be
        # triaged later.
        #
        # This was also a warning, with the comment "the existing code does
        # not pass this cleanly yet". It does now: the tree is clippy-clean
        # under `-D warnings`, with two documented project-wide allowances
        # (`clippy::type_complexity` in `rakc/src/lib.rs` and
        # `stdlib/src/lib.rs`) for a lint that asks for type aliases on the
        # value model's own types.
        run: cargo clippy --workspace --all-targets -- -D warnings

  hardening:
    name: hardening self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check the verifier's own fixtures
        # Runs the verifier against synthetic binaries that are known-good and
        # known-bad. Without this, a bug in the verifier means every release
        # reports "all hardening checks passed" and nobody finds out.
        run: python dist/verify_hardening.py --self-test
