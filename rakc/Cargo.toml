[package]
name = "rakc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rak language compiler - written for hackers and OSINT investigators"

[dependencies]
logos.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true

# Standard library with real networking
rak-stdlib = { path = "../stdlib" }
serde_json = "1.0"

# Parser - using chumsky for combinator approach
chumsky = { version = "1.0.0-alpha.7", default-features = false, features = ["std"] }

# GUI: WebView2 for Windows desktop windows
wry = { version = "0.55", optional = true }
tao = { version = "0.35", optional = true }

# REPL
rustyline = "15"

# LSP
tower-lsp = { version = "0.20", optional = true }
# Async event loop (always on; powers http_get_async / tcp_probe / await).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }

# Bindgen
bindgen = { version = "0.70", optional = true }

# Regex literals (/pattern/flags)
regex = "1.10"

# Future backends
# inkwell = { workspace = true, optional = true }
# cranelift = { optional = true }

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = []
llvm = [] # "inkwell"
jit = []
gui = ["dep:wry", "dep:tao"]
lsp = ["dep:tower-lsp"]
bindgen = ["dep:bindgen"]

[[bin]]
name = "rakc"
path = "src/main.rs"

[lib]
name = "rakc"
path = "src/lib.rs"