[package]
name = "rak-stdlib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0"
ureq = "2.9"
libloading = "0.8"
memmap2 = "0.9"
socket2 = "0.5"
libc = "0.2"
x509-parser = "0.16"
pcap = { version = "2", optional = true }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
# Constant-time comparison / conditional select, so secret comparisons do not
# leak their operand values through branch timing.
subtle = "2"
# Non-optimizable memory wiping, used by the secrets store and `zeroize`.
zeroize = { version = "1", features = ["zeroize_derive"] }
# RSA (PKCS#1 v1.5 signatures, OAEP encryption) and NIST P-256 ECDSA.
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
base64 = "0.22"
urlencoding = "2.1"
scraper = "0.20"
serde_json = "1.0"
flate2 = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Only for testing `regex_escape`: the property that matters is that the escaped
# form matches itself and not "abc" for "a.c*", which is a claim about the regex
# engine rather than about strings.
regex = "1"

[features]
default = []
# PCAP live/offline capture needs libpcap (Linux) / Npcap (Windows) installed.
pcap = ["dep:pcap"]
