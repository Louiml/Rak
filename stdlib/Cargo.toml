[package]
name = "rak-stdlib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0"
# The HTTP client is optional so the browser build can leave it out: `ureq`
# pulls `rustls` -> `ring`, and `ring` compiles C that needs a wasm-capable
# clang. Off means `http_get`/`http_post` answer with a clear error instead of
# being missing.
ureq = { version = "2.9", optional = true }
memmap2 = "0.9"
libc = "0.2"
x509-parser = "0.16"
pcap = { version = "2", optional = true }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
# Constant-time comparison / conditional select, so secret comparisons do not
# leak their operand values through branch timing.
subtle = "2"
# Non-optimizable memory wiping, used by the secrets store and `zeroize`.
zeroize = { version = "1", features = ["zeroize_derive"] }
# RSA (PKCS#1 v1.5 signatures, OAEP encryption) and NIST P-256 ECDSA.
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
# The random number generator. Optional so the browser build can leave it out:
# `rand` needs `getrandom`, whose browser backend pulls in `wasm-bindgen` and
# generated glue. The module keeps its shape without the dependency.
rand = { version = "0.8", optional = true }
base64 = "0.22"
urlencoding = "2.1"
# The HTML parser. Optional for the same reason: `scraper` needs `ahash`, which
# needs `getrandom`.
scraper = { version = "0.20", optional = true }
serde_json = "1.0"
flate2 = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Raw-socket I/O. `socket2` has no wasm support, and a browser has no raw
# sockets anyway, so it is left out of the browser build.
socket2 = "0.5"
# Shared-library loading. A page cannot `dlopen`, and `libloading` has no wasm
# implementation.
libloading = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `getrandom` refuses to build for wasm unless it is told how to get entropy.
# The browser build supplies its own - the `custom` backend, which the
# playground registers - so no `wasm-bindgen` and no generated glue are needed.
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
# Only for testing `regex_escape`: the property that matters is that the escaped
# form matches itself and not "abc" for "a.c*", which is a claim about the regex
# engine rather than about strings.
regex = "1"

[features]
default = ["http", "rand", "html"]
# The HTTP client. Off for the browser build, where the TLS stack it needs
# cannot be compiled.
http = ["dep:ureq"]
# The random number generator and the HTML parser. Off for the browser build:
# both need `getrandom`, whose browser backend pulls in `wasm-bindgen`.
rand = ["dep:rand"]
html = ["dep:scraper"]
# PCAP live/offline capture needs libpcap (Linux) / Npcap (Windows) installed.
pcap = ["dep:pcap"]
