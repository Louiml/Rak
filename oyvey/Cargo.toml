[package]
name = "oyvey"
version = "0.8.4"
edition = "2021"
authors = ["Louiml (Ryuzaki)"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Louiml/oyvey"
description = "Rak package manager and build system"
readme = "README.md"
keywords = ["rak", "package-manager", "oyvey", "cargo", "build"]
categories = ["development-tools::build-utils"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[lib]
name = "oyvey"
path = "src/lib.rs"

[[bin]]
name = "oyvey"
path = "src/main.rs"
